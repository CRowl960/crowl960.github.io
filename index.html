<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>[氏名] | Portfolio</title>
<meta name="description" content="[氏名]のポートフォリオ">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #232120;
    --sub: #57534E;
    --accent: #606B60;
    --line: #DAD6CE;
    --bg: #FAF9F6;
    --card: #FFFFFF;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Noto Sans JP", sans-serif;
    color: var(--ink);
    background: var(--bg);
    line-height: 1.8;
  }
  a { color: var(--accent); }
  a:hover { color: var(--ink); }
  .wrap { max-width: 880px; margin: 0 auto; padding: 0 24px; }

  header { padding: 96px 0 64px; text-align: center; }
  .name { font-size: clamp(32px, 7vw, 48px); font-weight: 700; letter-spacing: 0.3em; padding-left: 0.3em; margin: 0; }
  .roman { font-size: 14px; letter-spacing: 0.24em; color: var(--sub); margin: 4px 0 24px; }
  .rule { width: 160px; height: 1px; background: var(--line); margin: 0 auto 24px; border: 0; }
  .aff { margin: 0; color: var(--sub); }
  .notice {
    display: inline-block; margin-top: 32px; padding: 6px 16px;
    border: 1px dashed var(--accent); border-radius: 999px;
    color: var(--accent); font-size: 13px;
  }

  section { padding: 56px 0; border-top: 1px solid var(--line); }
  h2 { font-size: 14px; letter-spacing: 0.24em; color: var(--accent); margin: 0 0 24px; font-weight: 500; }

  .works { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 24px; }
  .work { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .thumb {
    aspect-ratio: 4 / 3; background: #EEECE7;
    display: flex; align-items: center; justify-content: center;
    color: #8A857D; font-size: 13px;
  }
  .work-body { padding: 16px 20px 20px; }
  .work-title { font-weight: 700; margin: 0 0 4px; }
  .work-meta { font-size: 13px; color: var(--sub); margin: 0; }

  .contact-list { list-style: none; padding: 0; margin: 0; }
  .contact-list li { padding: 8px 0; }

  footer { padding: 40px 0 64px; text-align: center; font-size: 12px; color: var(--sub); border-top: 1px solid var(--line); }
</style>
</head>
<body>
  <header class="wrap">
    <h1 class="name">[氏 名]</h1>
    <p class="roman">[NAME IN ROMAJI]</p>
    <hr class="rule">
    <p class="aff">[大学名 学部名 学科名]</p>
    <p class="aff">[活動の肩書き]</p>
    <p class="notice">このページは準備中です</p>
  </header>

  <main class="wrap">
    <section id="about">
      <h2>ABOUT</h2>
      <p>[自己紹介をここに書きます。どんなことに興味があって、何を作っているかを2〜3行で。]</p>
    </section>

    <section id="works">
      <h2>WORKS</h2>
      <div class="works">
        <article class="work">
          <div class="thumb">画像を入れる予定</div>
          <div class="work-body">
            <p class="work-title">[作品名]</p>
            <p class="work-meta">[年・担当範囲など]</p>
          </div>
        </article>
        <article class="work">
          <div class="thumb">画像を入れる予定</div>
          <div class="work-body">
            <p class="work-title">[作品名]</p>
            <p class="work-meta">[年・担当範囲など]</p>
          </div>
        </article>
        <article class="work">
          <div class="thumb">画像を入れる予定</div>
          <div class="work-body">
            <p class="work-title">[作品名]</p>
            <p class="work-meta">[年・担当範囲など]</p>
          </div>
        </article>
      </div>
    </section>

    <section id="contact">
      <h2>CONTACT</h2>
      <ul class="contact-list">
        <li>Mail：<a href="mailto:[メールアドレス]">[メールアドレス]</a></li>
        <li>GitHub：<a href="https://github.com/CRowl960">github.com/CRowl960</a></li>
      </ul>
    </section>
  </main>

  <footer>
    <div class="wrap">&copy; [氏名]</div>
  </footer>
</body>
</html>
